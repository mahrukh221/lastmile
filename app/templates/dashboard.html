{% extends "base.html" %}
{% block content %}
  <h1>Welcome, {{ user.full_name }}</h1>
  <p>You are logged in as <strong>{{ user.role }}</strong>.</p>
  {% if user.role == "admin" %}
    <p><a href="/admin/keys">Manage API keys</a></p>
  {% endif %}
  <p><a href="/logout">Log out</a></p>
{% endblock %}
